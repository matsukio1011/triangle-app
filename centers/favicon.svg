<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Indigo & Navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Triangle Stroke Gradient -->
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Gold Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.2" />

  <!-- Geometric Grid Accent (Subtle) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.3" />

  <!-- Triangle ABC -->
  <!-- A: (256, 85), B: (88, 395), C: (424, 395) -->
  <polygon points="256,85 88,395 424,395" fill="rgba(99, 102, 241, 0.15)" stroke="url(#triGrad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Incircle (内心の内接円) -->
  <!-- Center: (256, 298), Radius: ~97 -->
  <circle cx="256" cy="298" r="97" fill="none" stroke="#34d399" stroke-width="8" stroke-dasharray="12 8" stroke-opacity="0.85" />

  <!-- Medians (中線 - 重心へのライン) -->
  <!-- Midpoint of BC is (256, 395) -->
  <line x1="256" y1="85" x2="256" y2="395" stroke="#a5b4fc" stroke-width="6" stroke-dasharray="10 10" stroke-opacity="0.75" />
  <!-- Midpoint of AC is (340, 240) -->
  <line x1="88" y1="395" x2="340" y2="240" stroke="#a5b4fc" stroke-width="6" stroke-dasharray="10 10" stroke-opacity="0.75" />

  <!-- Centroid Point G (重心) (256, 292) -->
  <circle cx="256" cy="292" r="32" fill="url(#centerGlow)" filter="url(#shadow)" />
  <circle cx="256" cy="292" r="15" fill="#ffffff" />

  <!-- Vertices Accents -->
  <circle cx="256" cy="85" r="10" fill="#38bdf8" />
  <circle cx="88" cy="395" r="10" fill="#818cf8" />
  <circle cx="424" cy="395" r="10" fill="#c084fc" />
</svg>
