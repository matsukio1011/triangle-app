<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="星形や交差する図形の、印のついた角の和を4択で練習。"><title>等しい角トレーニング</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e7490'/%3E%3Cpath d='M32 9 46 53 10 26 54 26 18 53Z' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><style>
:root{color-scheme:light;--bg:#edf3f7;--panel:#fff;--text:#183143;--muted:#637789;--line:#dce5ec;--accent:#087e96;--soft:#e4f5f8;--good:#16815c;--bad:#c44c3b;--grid:#e9f0f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif}body.dark{color-scheme:dark;--bg:#101d29;--panel:#182b3b;--text:#edf6ff;--muted:#a9bfce;--line:#324b5f;--accent:#64d4e4;--soft:#203e4d;--good:#73ddac;--bad:#ffb2a3;--grid:#21394b}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.app{height:100dvh;min-height:440px;max-width:1480px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;gap:22px;padding:24px 36px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;background:var(--accent);color:var(--panel);border-radius:13px;display:grid;place-items:center;font-size:27px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted);margin-bottom:3px}h1{font-size:21px;margin:0;letter-spacing:.035em}.tools{display:flex;gap:10px}.tool{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 15px;border-radius:10px;font-size:14px}.tool:hover{border-color:var(--accent)}main{min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:24px}.figure{min-height:0;position:relative;border:1px solid var(--line);border-radius:24px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}.figure-top{padding:22px 26px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}.badge{color:var(--accent);background:var(--soft);padding:7px 12px;border-radius:20px;font-weight:700}.drawing{min-height:0;flex:1;display:grid;place-items:center;background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px}.drawing svg{width:100%;height:100%;max-height:600px}.figure-note{padding:16px;text-align:center;color:var(--muted);font-size:14px}.side{display:flex;flex-direction:column;justify-content:center;min-height:0;padding:12px 8px}.overline{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:.08em}.side h2{font-size:clamp(24px,2.4vw,34px);line-height:1.55;margin:16px 0 10px;letter-spacing:.025em}.instruction{color:var(--muted);font-size:16px;margin:0 0 26px;line-height:1.8}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{position:relative;min-height:96px;border:2px solid var(--line);border-radius:16px;color:var(--text);background:var(--panel);font-size:30px;font-weight:700;transition:background .15s,border-color .15s,transform .15s}.answer:hover:not(:disabled){border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}.key{position:absolute;left:12px;top:10px;font-size:12px;font-weight:500;color:var(--muted)}.answer.correct{border-color:var(--good);background:var(--soft);color:var(--good)}.answer.wrong{border-color:var(--bad);color:var(--bad)}.answer:disabled{cursor:default}.feedback{height:70px;display:flex;align-items:center;font-size:16px;font-weight:700;line-height:1.6;color:var(--muted)}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}footer{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}.count{color:var(--text);font-weight:700}.legend{display:flex;align-items:center;gap:8px}.arc-icon{width:15px;height:15px;border:2px solid var(--accent);border-bottom:0;border-left:0;border-radius:0 100% 0 0}@media(max-height:650px){.app{padding:16px 28px;gap:12px}.figure-top{padding:12px 20px}.side h2{margin:8px 0}.instruction{margin-bottom:15px}.answer{min-height:72px}.feedback{height:54px}.figure-note{padding:10px}}@media(max-width:760px){.app{padding:14px;gap:12px;min-height:650px}main{grid-template-columns:1fr;grid-template-rows:minmax(200px,1fr) auto;gap:8px}h1{font-size:16px}.eyebrow{display:none}.tool{font-size:12px;padding:9px}.logo{display:none}.side{padding:0}.side h2{font-size:20px;margin:3px 0}.side h2 br{display:none}.instruction{font-size:14px;margin:0 0 10px}.overline{display:none}.answer{min-height:62px;font-size:25px}.feedback{height:44px;font-size:14px}.figure-top{padding:10px 16px}.figure-note{padding:7px;font-size:12px}footer{font-size:12px}.shortcut{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.vertex{cursor:pointer;outline:none}.vertex .dot{opacity:0;fill:var(--accent);stroke:none;pointer-events:none}.vertex:hover .dot,.vertex:focus-visible .dot,.vertex[aria-pressed="true"] .dot{opacity:1}.vertex .halo{fill:transparent;pointer-events:all}.vertex:focus-visible .halo,.vertex[aria-pressed="true"] .halo{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:1.5}.drawing.points-hidden .vertex .dot{opacity:0}.drawing.points-hidden .vertex .halo{fill:transparent;stroke:none}.helper-line{stroke:#d16a11;stroke-width:3;stroke-dasharray:9 6;pointer-events:none}.dark .helper-line{stroke:#ffb863}.figure-note{display:flex;align-items:center;justify-content:center;gap:12px}.figure-note .tool{flex-shrink:0;padding:7px 10px}.tool:disabled{opacity:.45;cursor:default}.mode-link{text-decoration:none;display:inline-flex;align-items:center}.selection{padding:18px 0;color:var(--accent);font-weight:700;font-size:18px}.judge{padding:18px;background:var(--accent);color:var(--panel);font-size:19px;font-weight:700;border:0;border-radius:14px;margin:4px 0 14px}.judge:disabled{opacity:.45;cursor:default}.angle-choice{cursor:pointer;outline:none}.angle-choice path{fill:transparent;stroke:none;pointer-events:all}.angle-choice .selection-mark{fill:var(--panel);stroke:var(--accent);stroke-width:2.5;pointer-events:all}.angle-choice:focus-visible{outline:2px dotted var(--accent);outline-offset:3px}.fold-edge{fill:none;stroke:var(--text);stroke-width:2.5;stroke-linejoin:round;pointer-events:none}.original-edge{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:7 5;pointer-events:none}.crease{stroke:var(--accent);stroke-width:2;pointer-events:none}.tools{flex-wrap:wrap}@media(max-height:650px){.selection{padding:8px 0}.judge{padding:12px}}.streak-box{margin-top:16px;padding:12px 16px;background:var(--soft);border-radius:12px;font-size:16px}.streak-box strong{color:var(--accent);font-size:24px}.streak-box small{margin-left:12px;color:var(--muted);font-size:14px}.streak-box progress{display:block;width:100%;height:7px;margin-top:8px;accent-color:var(--accent)}.pass-dialog{background:var(--panel);color:var(--text);border:2px solid var(--accent);border-radius:24px;width:min(460px,90vw);text-align:center;padding:40px 28px}.pass-dialog::backdrop{background:rgb(5 18 30 / .75)}.pass-dialog h2{font-size:48px;color:var(--accent);margin:12px 0}.pass-dialog p{font-size:18px;line-height:1.7}.pass-dialog button{margin-top:16px;background:var(--accent);color:var(--panel);border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:18px}@media(max-height:700px){.streak-box{margin-top:8px;padding:6px 12px}.feedback{height:56px}.side h2{font-size:26px;line-height:1.3}.instruction{margin-bottom:12px}}@media(max-height:580px) and (min-width:761px){.side h2{font-size:22px}.overline{display:none}.answer{min-height:60px}.instruction{font-size:14px;line-height:1.5}.selection{padding:4px 0}.judge{padding:10px;margin:0 0 8px}.feedback{font-size:14px;height:48px}}</style></head><body><div class="app"><header><div class="brand"><div class="logo" aria-hidden="true">∠</div><div><div class="eyebrow">GEOMETRY PRACTICE</div><h1>等しい角トレーニング</h1></div></div><div class="tools"><a class="tool mode-link" href="../index.html">アプリ一覧</a><a class="tool mode-link" href="index.html">角の和を練習</a><button class="tool" id="theme" aria-pressed="false">☾ ダークモード</button><button class="tool" id="fullscreen">⛶ 全画面表示</button></div></header><main><section class="figure" aria-label="問題の図"><div class="figure-top"><span class="badge" id="question">第1問</span><span>帯の折り返し</span></div><div class="drawing" id="drawing"></div><div class="figure-note">破線は折る前の辺、実線は折ったあとの辺</div></section><section class="side"><div class="overline">等しい角を見つけよう</div><h2>等しい角を<br>3つ選ぼう！</h2><p class="instruction">角の内側をクリックすると、小さな丸がつくぞ。<br>丸をクリックで解除。4つ目を選ぶと最初の選択を入れ替えるぞ。</p><div class="selection" id="selection" aria-live="polite">選んだ角：0個</div><button class="judge" id="judge" disabled>3つ選んで判定する</button><button class="tool" id="reset-selection">選択をやり直す</button><div class="streak-box" aria-live="polite"><span>連続正解 <strong id="streak">0</strong> 回 <small>15回で合格</small></span><progress id="streak-progress" max="15" value="0" aria-label="連続正解、15回で合格"></progress></div><div class="feedback" id="feedback" role="status" aria-live="polite">じっくり考えてみよう。</div></section></main><footer><span>正解 <span class="count" id="count">0</span> 問</span><span class="legend"><i class="arc-icon" aria-hidden="true"></i>帯の上下の辺は平行</span><span class="shortcut">丸をつけた角を3つ選ぼう</span></footer></div><dialog id="pass-dialog" class="pass-dialog" aria-labelledby="pass-title"><p>等しい角トレーニング</p><h2 id="pass-title">合格！</h2><p>15回連続正解！<br>よくがんばったな！</p><button id="restart">もう一度チャレンジ</button></dialog><script>
const drawing=document.getElementById('drawing'),judge=document.getElementById('judge');
let number=0,score=0,locked=false,selected=new Set(),angles=[],diagram='',timer=null,previous=-1;
const variants=[38,42,48,52,56,64,68,72];
function message(t,c){const el=document.getElementById('feedback');el.textContent=t;el.className='feedback '+c}
function geometry(degrees,rotation){
 const t=degrees*Math.PI/180,h=120,A=[185,110],B=[185+h/Math.tan(t),230],right=B[0]+145;
 const TL=[35,110],BL=[35,230],TR=[right,110],BR=[right,230];
 function reflect(p){const dx=p[0]-A[0],dy=p[1]-A[1],dot=dx*Math.cos(t)+dy*Math.sin(t);return [A[0]+2*dot*Math.cos(t)-dx,A[1]+2*dot*Math.sin(t)-dy]}
 const R=reflect(TR),S=reflect(BR),r=rotation*Math.PI/180;
 function rotate(p){return [p[0]*Math.cos(r)-p[1]*Math.sin(r),p[0]*Math.sin(r)+p[1]*Math.cos(r)]}
 const all=[TL,BL,TR,BR,A,B,R,S].map(rotate),minX=Math.min(...all.map(p=>p[0])),maxX=Math.max(...all.map(p=>p[0])),minY=Math.min(...all.map(p=>p[1])),maxY=Math.max(...all.map(p=>p[1]));
 const scale=Math.min(420/(maxX-minX),350/(maxY-minY));
 function map(p){const q=rotate(p);return [250+(q[0]-(minX+maxX)/2)*scale,220+(q[1]-(minY+maxY)/2)*scale]}
 function line(p,cls,close=false){return '<path class="'+cls+'" d="M '+p.map(v=>map(v).join(',')).join(' L ')+(close?' Z':'')+'"/>'}
 const defs=[{v:A,s:0,e:t},{v:A,s:t,e:2*t},{v:B,s:Math.PI,e:Math.PI+t},{v:A,s:2*t,e:Math.PI},{v:B,s:0,e:2*t},{v:B,s:2*t,e:Math.PI}];
 // Shuffle the labels so the correct set cannot be learned by letter alone.
 for(let i=defs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[defs[i],defs[j]]=[defs[j],defs[i]]}
 angles=defs.map((d,i)=>{const pts=[map(d.v)];for(let k=0;k<=24;k++){const a=d.s+(d.e-d.s)*k/24;pts.push(map([d.v[0]+43*Math.cos(a),d.v[1]+43*Math.sin(a)]))}const mid=(d.s+d.e)/2;return {center:map(d.v),start:d.s+r,end:d.e+r,hitRadius:Math.min(80,Math.hypot(...map(A).map((v,j)=>v-map(B)[j]))*.48),id:i,size:(d.e-d.s)*180/Math.PI,path:'M '+pts.map(p=>p.join(',')).join(' L ')+' Z',label:map([d.v[0]+30*Math.cos(mid),d.v[1]+30*Math.sin(mid)])}});
 return line([TL,TR,BR,BL],'original-edge',true)+line([TL,A,B,BL],'fold-edge',true)+line([A,R,S,B],'fold-edge',true)+line([A,B],'crease');
}
function render(){drawing.innerHTML='<svg viewBox="0 0 500 440" role="group" aria-label="帯を折り返した図。角の内側をクリックして等しい3つを選択">'+diagram+angles.map(a=>'<g class="angle-choice" data-angle="'+a.id+'" tabindex="0" role="button" aria-label="角'+String.fromCharCode(65+a.id)+'" aria-pressed="'+selected.has(a.id)+'"><path d="'+a.path+'"/>'+(selected.has(a.id)?'<circle class="selection-mark" cx="'+a.label[0]+'" cy="'+a.label[1]+'" r="5"/>':'')+'</g>').join('')+'</svg>';document.getElementById('selection').textContent='選んだ角：'+selected.size+'個';judge.disabled=selected.size!==3||locked;document.getElementById('reset-selection').disabled=locked}
function selectAngle(i){if(locked||!Number.isInteger(i)||i<0||i>=angles.length)return;if(selected.has(i))selected.delete(i);else if(selected.size<3)selected.add(i);else{selected.delete(selected.values().next().value);selected.add(i)}message(selected.size===3?'3つ選べたぞ。「判定する」を押してな。':'等しい角を3つ選んでみよう。','');render()}
function next(){locked=false;selected.clear();number++;let index;do{index=Math.floor(Math.random()*variants.length)}while(index===previous);previous=index;diagram=geometry(variants[index],[0,90,180,270][Math.floor(Math.random()*4)]);document.getElementById('question').textContent='第'+number+'問';render();message('等しい角を3つ選んでみよう。','')}
function check(){if(locked||selected.size!==3)return;const values=[...selected].map(i=>angles[i].size);if(Math.max(...values)-Math.min(...values)<.00001){locked=true;score++;document.getElementById('count').textContent=score;render();message('正解！ 折り返しと平行線で、3つの角は等しいぞ！','good');correctResult(1800)}else{wrongResult();message('おしい！ 折り目の両側の角と、平行な辺に注目してみよう。','bad')}}
function hitAngle(x,y){
 const candidates=angles.map(a=>{const dx=x-a.center[0],dy=y-a.center[1],distance=Math.hypot(dx,dy);const turn=Math.PI*2,relative=((Math.atan2(dy,dx)-a.start)%turn+turn)%turn,width=a.end-a.start;const inside=relative<=width;const boundary=Math.min(relative,turn-relative,Math.abs(relative-width));return {a,distance,inside,boundary}}).filter(c=>c.distance<=c.a.hitRadius&&(c.inside||c.boundary<.06));
 candidates.sort((a,b)=>Number(b.inside)-Number(a.inside)||a.distance-b.distance||a.boundary-b.boundary);return candidates.length?candidates[0].a.id:null;
}
drawing.addEventListener('click',e=>{const svg=drawing.querySelector('svg');if(!svg)return;const matrix=svg.getScreenCTM();if(!matrix)return;const point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;const local=point.matrixTransform(matrix.inverse());const mark=e.target.closest('.selection-mark');const i=mark?Number(mark.closest('[data-angle]').dataset.angle):hitAngle(local.x,local.y);if(i!==null)selectAngle(i);else if(!locked)message('折り目の端にある角の、内側をクリックしてな。','')});
drawing.addEventListener('keydown',e=>{const a=e.target.closest('[data-angle]');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const i=Number(a.dataset.angle);selectAngle(i);drawing.querySelector('[data-angle="'+i+'"]').focus()}});
document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.repeat&&/^[a-f]$/i.test(e.key)){e.preventDefault();selectAngle(e.key.toUpperCase().charCodeAt(0)-65)}});
judge.onclick=check;document.getElementById('reset-selection').onclick=()=>{if(locked)return;selected.clear();render();message('もう一度、3つ選んでみよう。','')};

let streak=0,audioContext=null;
function updateStreak(){document.getElementById('streak').textContent=streak;document.getElementById('streak-progress').value=streak}
async function playResultSound(correct){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext??=new Audio();if(audioContext.state==='suspended')await audioContext.resume();const now=audioContext.currentTime;const notes=correct?[[659,0,.13],[880,.14,.23]]:[[196,0,.18],[147,.19,.26]];for(const [frequency,delay,duration] of notes){const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type=correct?'sine':'triangle';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,now+delay);gain.gain.linearRampToValueAtTime(.12,now+delay+.015);gain.gain.exponentialRampToValueAtTime(.001,now+delay+duration);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(now+delay);oscillator.stop(now+delay+duration+.02);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()}}}catch{}}
function correctResult(delay){streak++;updateStreak();playResultSound(true);if(streak>=15){message('15回連続正解！ 合格だぞ！','good');document.getElementById('pass-dialog').showModal();document.getElementById('restart').focus()}else setTimeout(next,delay)}
function wrongResult(){streak=0;updateStreak();playResultSound(false)}
document.getElementById('pass-dialog').addEventListener('cancel',e=>e.preventDefault());
document.getElementById('restart').onclick=()=>{document.getElementById('pass-dialog').close();streak=0;updateStreak();next();document.querySelector('.answer, .angle-choice')?.focus()};

const theme=document.getElementById('theme');function setTheme(dark){document.body.classList.toggle('dark',dark);theme.setAttribute('aria-pressed',String(dark));theme.textContent=dark?'☀ ライトモード':'☾ ダークモード'}let preference;try{preference=localStorage.getItem('angle-theme')}catch{}setTheme(preference?preference==='dark':matchMedia('(prefers-color-scheme: dark)').matches);theme.onclick=()=>{const d=!document.body.classList.contains('dark');setTheme(d);try{localStorage.setItem('angle-theme',d?'dark':'light')}catch{}};
const full=document.getElementById('fullscreen');full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error()}catch{message('全画面にできない場合は、ブラウザーで F11 を押してな。','')}};document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'⛶ 全画面を終了':'⛶ 全画面表示';full.setAttribute('aria-pressed',String(!!document.fullscreenElement))});next();
</script></body></html>
