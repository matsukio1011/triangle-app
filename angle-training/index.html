<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="星形や交差する図形の、印のついた角の和を4択で練習。"><title>角の和トレーニング</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e7490'/%3E%3Cpath d='M32 9 46 53 10 26 54 26 18 53Z' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><style>
:root{color-scheme:light;--bg:#edf3f7;--panel:#fff;--text:#183143;--muted:#637789;--line:#dce5ec;--accent:#087e96;--soft:#e4f5f8;--good:#16815c;--bad:#c44c3b;--grid:#e9f0f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif}body.dark{color-scheme:dark;--bg:#101d29;--panel:#182b3b;--text:#edf6ff;--muted:#a9bfce;--line:#324b5f;--accent:#64d4e4;--soft:#203e4d;--good:#73ddac;--bad:#ffb2a3;--grid:#21394b}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.app{height:100dvh;min-height:440px;max-width:1480px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;gap:22px;padding:24px 36px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;background:var(--accent);color:var(--panel);border-radius:13px;display:grid;place-items:center;font-size:27px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted);margin-bottom:3px}h1{font-size:21px;margin:0;letter-spacing:.035em}.tools{display:flex;gap:10px}.tool{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 15px;border-radius:10px;font-size:14px}.tool:hover{border-color:var(--accent)}main{min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:24px}.figure{min-height:0;position:relative;border:1px solid var(--line);border-radius:24px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}.figure-top{padding:22px 26px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}.badge{color:var(--accent);background:var(--soft);padding:7px 12px;border-radius:20px;font-weight:700}.drawing{min-height:0;flex:1;display:grid;place-items:center;background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px}.drawing svg{width:100%;height:100%;max-height:600px}.figure-note{padding:16px;text-align:center;color:var(--muted);font-size:14px}.side{display:flex;flex-direction:column;justify-content:center;min-height:0;padding:12px 8px}.overline{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:.08em}.side h2{font-size:clamp(24px,2.4vw,34px);line-height:1.55;margin:16px 0 10px;letter-spacing:.025em}.instruction{color:var(--muted);font-size:16px;margin:0 0 26px;line-height:1.8}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{position:relative;min-height:96px;border:2px solid var(--line);border-radius:16px;color:var(--text);background:var(--panel);font-size:30px;font-weight:700;transition:background .15s,border-color .15s,transform .15s}.answer:hover:not(:disabled){border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}.key{position:absolute;left:12px;top:10px;font-size:12px;font-weight:500;color:var(--muted)}.answer.correct{border-color:var(--good);background:var(--soft);color:var(--good)}.answer.wrong{border-color:var(--bad);color:var(--bad)}.answer:disabled{cursor:default}.feedback{height:70px;display:flex;align-items:center;font-size:16px;font-weight:700;line-height:1.6;color:var(--muted)}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}footer{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}.count{color:var(--text);font-weight:700}.legend{display:flex;align-items:center;gap:8px}.arc-icon{width:15px;height:15px;border:2px solid var(--accent);border-bottom:0;border-left:0;border-radius:0 100% 0 0}@media(max-height:650px){.app{padding:16px 28px;gap:12px}.figure-top{padding:12px 20px}.side h2{margin:8px 0}.instruction{margin-bottom:15px}.answer{min-height:72px}.feedback{height:54px}.figure-note{padding:10px}}@media(max-width:760px){.app{padding:14px;gap:12px;min-height:650px}main{grid-template-columns:1fr;grid-template-rows:minmax(200px,1fr) auto;gap:8px}h1{font-size:16px}.eyebrow{display:none}.tool{font-size:12px;padding:9px}.logo{display:none}.side{padding:0}.side h2{font-size:20px;margin:3px 0}.side h2 br{display:none}.instruction{font-size:14px;margin:0 0 10px}.overline{display:none}.answer{min-height:62px;font-size:25px}.feedback{height:44px;font-size:14px}.figure-top{padding:10px 16px}.figure-note{padding:7px;font-size:12px}footer{font-size:12px}.shortcut{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.vertex{cursor:pointer;outline:none}.vertex .dot{opacity:0;fill:var(--accent);stroke:none;pointer-events:none}.vertex:hover .dot,.vertex:focus-visible .dot,.vertex[aria-pressed="true"] .dot{opacity:1}.vertex .halo{fill:transparent;pointer-events:all}.vertex:focus-visible .halo,.vertex[aria-pressed="true"] .halo{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:1.5}.drawing.points-hidden .vertex .dot{opacity:0}.drawing.points-hidden .vertex .halo{fill:transparent;stroke:none}.helper-line{stroke:#d16a11;stroke-width:3;stroke-dasharray:9 6;pointer-events:none}.dark .helper-line{stroke:#ffb863}.figure-note{display:flex;align-items:center;justify-content:center;gap:12px}.figure-note .tool{flex-shrink:0;padding:7px 10px}.tool:disabled{opacity:.45;cursor:default}.mode-link{text-decoration:none;display:inline-flex;align-items:center}.streak-box{margin-top:16px;padding:12px 16px;background:var(--soft);border-radius:12px;font-size:16px}.streak-box strong{color:var(--accent);font-size:24px}.streak-box small{margin-left:12px;color:var(--muted);font-size:14px}.streak-box progress{display:block;width:100%;height:7px;margin-top:8px;accent-color:var(--accent)}.pass-dialog{background:var(--panel);color:var(--text);border:2px solid var(--accent);border-radius:24px;width:min(460px,90vw);text-align:center;padding:40px 28px}.pass-dialog::backdrop{background:rgb(5 18 30 / .75)}.pass-dialog h2{font-size:48px;color:var(--accent);margin:12px 0}.pass-dialog p{font-size:18px;line-height:1.7}.pass-dialog button{margin-top:16px;background:var(--accent);color:var(--panel);border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:18px}@media(max-height:700px){.streak-box{margin-top:8px;padding:6px 12px}.feedback{height:56px}.side h2{font-size:26px;line-height:1.3}.instruction{margin-bottom:12px}}@media(max-height:580px) and (min-width:761px){.side h2{font-size:22px}.overline{display:none}.answer{min-height:60px}.instruction{font-size:14px;line-height:1.5}.selection{padding:4px 0}.judge{padding:10px;margin:0 0 8px}.feedback{font-size:14px;height:48px}}</style></head><body><div class="app"><header><div class="brand"><div class="logo" aria-hidden="true">∠</div><div><div class="eyebrow">GEOMETRY PRACTICE</div><h1>角の和トレーニング</h1></div></div><div class="tools"><a class="tool mode-link" href="../index.html">アプリ一覧</a><a class="tool mode-link" href="equal.html">等しい角を3つ</a><button class="tool" id="theme" aria-pressed="false">☾ ダークモード</button><button class="tool" id="fullscreen">⛶ 全画面表示</button></div></header><main><section class="figure" aria-label="問題の図"><div class="figure-top"><span class="badge" id="question">第1問</span><span>角の和</span></div><div class="drawing" id="drawing"></div><div class="figure-note"><span id="line-help" role="status" aria-live="polite">頂点にマウスを近づけて、2つ選ぼう</span><button class="tool" id="clear-lines" disabled>補助線を消す</button></div></section><section class="side"><div class="overline">角度を見抜こう</div><h2>印のついた角の和は<br>何度かな？</h2><p class="instruction">4つの答えから、正しいものを選ぶんだ！</p><div class="answers" id="answers"></div><div class="streak-box" aria-live="polite"><span>連続正解 <strong id="streak">0</strong> 回 <small>15回で合格</small></span><progress id="streak-progress" max="15" value="0" aria-label="連続正解、15回で合格"></progress></div><div class="feedback" id="feedback" role="status" aria-live="polite">じっくり考えてみよう。</div></section></main><footer><span>正解 <span class="count" id="count">0</span> 問</span><span class="legend"><i class="arc-icon" aria-hidden="true"></i>印のある角だけを足す</span><span class="shortcut">キーボードの 1〜4 でも回答</span></footer></div><dialog id="pass-dialog" class="pass-dialog" aria-labelledby="pass-title"><p>角の和トレーニング</p><h2 id="pass-title">合格！</h2><p>15回連続正解！<br>よくがんばったな！</p><button id="restart">もう一度チャレンジ</button></dialog><script>
const templates=[
[[50,140],[118,72],[376,72],[448,172],[448,272],[335,356],[175,247],[173,175],[326,178],[326,251],[169,354],[50,278]],
[[250,42],[367,393],[66,171],[434,171],[133,393]],
[[126,64],[380,139],[414,363],[170,214],[339,244],[83,374]],
[[232,48],[376,111],[418,375],[174,182],[328,182],[139,378],[77,193]],
[[211,47],[310,76],[74,383],[98,218],[419,278],[331,380]],
[[204,64],[306,47],[187,382],[79,314],[421,248],[388,379],[193,130]],
[[246,45],[421,250],[98,382],[49,125],[409,109],[397,383],[73,279]],
[[83,83],[398,202],[84,372],[302,80],[302,371]],
[[76,64],[410,65],[187,294],[187,134],[373,367],[129,367]],
[[80,68],[400,360],[138,267],[411,69],[152,394]],
[[25,204],[177,61],[430,305],[185,387],[25,297],[340,54],[426,204]]
];
function angleSum(p){return p.reduce((s,b,i)=>{let a=p[(i+p.length-1)%p.length],c=p[(i+1)%p.length];let u=[a[0]-b[0],a[1]-b[1]],v=[c[0]-b[0],c[1]-b[1]];return s+Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)))))*180/Math.PI},0)}
const valid=templates.filter(p=>Math.abs(angleSum(p)-Math.round(angleSum(p)/180)*180)<.00001);
let number=0,score=0,current=0,locked=false,deck=[],last=-1;
let points=[],segments=[],selectedVertex=null,suppressedVertex=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function svg(p){let paths='';p.forEach((b,i)=>{const a=p[(i+p.length-1)%p.length],c=p[(i+1)%p.length];let start=Math.atan2(a[1]-b[1],a[0]-b[0]),end=Math.atan2(c[1]-b[1],c[0]-b[0]),delta=Math.atan2(Math.sin(end-start),Math.cos(end-start));const r=Math.min(27,Math.hypot(a[0]-b[0],a[1]-b[1])*.21,Math.hypot(c[0]-b[0],c[1]-b[1])*.21),x=b[0]+r*Math.cos(start),y=b[1]+r*Math.sin(start),xx=b[0]+r*Math.cos(start+delta),yy=b[1]+r*Math.sin(start+delta);paths+=`<path d="M ${b} L ${x},${y} A ${r},${r} 0 0 ${delta>0?1:0} ${xx},${yy} Z" fill="var(--accent)" opacity=".12"/><path d="M ${x},${y} A ${r},${r} 0 0 ${delta>0?1:0} ${xx},${yy}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`});return `<svg viewBox="0 0 500 440" role="group" aria-label="${p.length}個の頂点に角の印がある交差した図形。頂点を2つ選択して補助線を引けます"><path d="M ${p.map(v=>v.join(',')).join(' L ')} Z" fill="none" stroke="var(--text)" stroke-width="3" stroke-linejoin="round"/>${paths}${segmentMarkup()}${p.map(([x,y],i)=>`<g class="vertex" data-vertex="${i}" role="button" tabindex="0" aria-label="頂点${i+1}" aria-pressed="${selectedVertex===i}"><circle class="halo" cx="${x}" cy="${y}" r="17"/><circle class="dot" cx="${x}" cy="${y}" r="5"/></g>`).join('')}</svg>`}
function next(){locked=false;number++;if(!deck.length){deck=shuffle(valid.map((_,i)=>i));if(deck[deck.length-1]===last&&deck.length>1)[deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]]}last=deck.pop();let p=valid[last].map(v=>[...v]);if(Math.random()<.5)p=p.map(([x,y])=>[500-x,y]);current=Math.round(angleSum(p));points=p;segments=[];selectedVertex=null;suppressedVertex=null;renderDrawing();document.getElementById('question').textContent=`第${number}問`;const options=shuffle(current<=720?[180,360,540,720]:[current-360,current-180,current,current+180]);document.getElementById('answers').innerHTML=options.map((v,i)=>`<button class="answer" data-value="${v}" aria-label="${i+1}番、${v}度"><span class="key">${i+1}</span>${v}°</button>`).join('');message('じっくり考えてみよう。','');}
function message(t,c){let el=document.getElementById('feedback');el.textContent=t;el.className='feedback '+c}
function answer(button){if(locked||button.disabled)return;if(Number(button.dataset.value)===current){locked=true;score++;document.getElementById('count').textContent=score;button.classList.add('correct');document.querySelectorAll('.answer').forEach(b=>b.disabled=true);message('正解！ その調子だぞ！ 次の問題へ…','good');correctResult(1100)}else{wrongResult();button.classList.add('wrong');button.disabled=true;message('おしい！ もう一度考えてみよう。','bad')}}
document.getElementById('answers').addEventListener('click',e=>{const b=e.target.closest('.answer');if(b)answer(b)});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.repeat&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(document.querySelectorAll('.answer')[Number(e.key)-1])}});

function segmentMarkup(){return segments.map(([a,b])=>'<line class="helper-line" x1="'+points[a][0]+'" y1="'+points[a][1]+'" x2="'+points[b][0]+'" y2="'+points[b][1]+'"/>').join('')}
function renderDrawing(){document.getElementById('drawing').classList.toggle('points-hidden',suppressedVertex!==null);document.getElementById('drawing').innerHTML=svg(points);document.getElementById('clear-lines').disabled=!segments.length&&selectedVertex===null;document.getElementById('line-help').textContent=selectedVertex===null?'頂点にマウスを近づけて、2つ選ぼう':'もう1つの頂点を選んでな（同じ点で解除）'}
function chooseVertex(i){if(locked||!Number.isInteger(i)||i<0||i>=points.length)return;suppressedVertex=null;if(selectedVertex===null)selectedVertex=i;else if(selectedVertex===i)selectedVertex=null;else{const a=Math.min(selectedVertex,i),b=Math.max(selectedVertex,i);if(!segments.some(s=>s[0]===a&&s[1]===b))segments.push([a,b]);selectedVertex=null;suppressedVertex=i}renderDrawing()}
const drawing=document.getElementById('drawing');
drawing.addEventListener('pointermove',e=>{if(suppressedVertex===null)return;const vertex=e.target.closest('[data-vertex]');if(!vertex||Number(vertex.dataset.vertex)!==suppressedVertex){suppressedVertex=null;drawing.classList.toggle('points-hidden',false)}});
drawing.addEventListener('pointerleave',()=>{suppressedVertex=null;drawing.classList.toggle('points-hidden',false)});
drawing.addEventListener('focusin',()=>{suppressedVertex=null;drawing.classList.toggle('points-hidden',false)});
drawing.addEventListener('click',e=>{const vertex=e.target.closest('[data-vertex]');if(vertex)chooseVertex(Number(vertex.dataset.vertex))});
drawing.addEventListener('keydown',e=>{const vertex=e.target.closest('[data-vertex]');if(vertex&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const i=Number(vertex.dataset.vertex);chooseVertex(i);drawing.querySelector('[data-vertex="'+i+'"]').focus()}else if(e.key==='Escape'){selectedVertex=null;renderDrawing();if(vertex)drawing.querySelector('[data-vertex="'+vertex.dataset.vertex+'"]').focus()}});
document.getElementById('clear-lines').onclick=()=>{segments=[];selectedVertex=null;suppressedVertex=null;renderDrawing()};


let streak=0,audioContext=null;
function updateStreak(){document.getElementById('streak').textContent=streak;document.getElementById('streak-progress').value=streak}
async function playResultSound(correct){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext??=new Audio();if(audioContext.state==='suspended')await audioContext.resume();const now=audioContext.currentTime;const notes=correct?[[659,0,.13],[880,.14,.23]]:[[196,0,.18],[147,.19,.26]];for(const [frequency,delay,duration] of notes){const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type=correct?'sine':'triangle';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,now+delay);gain.gain.linearRampToValueAtTime(.12,now+delay+.015);gain.gain.exponentialRampToValueAtTime(.001,now+delay+duration);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(now+delay);oscillator.stop(now+delay+duration+.02);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()}}}catch{}}
function correctResult(delay){streak++;updateStreak();playResultSound(true);if(streak>=15){message('15回連続正解！ 合格だぞ！','good');document.getElementById('pass-dialog').showModal();document.getElementById('restart').focus()}else setTimeout(next,delay)}
function wrongResult(){streak=0;updateStreak();playResultSound(false)}
document.getElementById('pass-dialog').addEventListener('cancel',e=>e.preventDefault());
document.getElementById('restart').onclick=()=>{document.getElementById('pass-dialog').close();streak=0;updateStreak();next();document.querySelector('.answer, .angle-choice')?.focus()};

const theme=document.getElementById('theme');function setTheme(dark){document.body.classList.toggle('dark',dark);theme.setAttribute('aria-pressed',String(dark));theme.textContent=dark?'☀ ライトモード':'☾ ダークモード'}let preference;try{preference=localStorage.getItem('angle-theme')}catch{}setTheme(preference?preference==='dark':matchMedia('(prefers-color-scheme: dark)').matches);theme.onclick=()=>{const d=!document.body.classList.contains('dark');setTheme(d);try{localStorage.setItem('angle-theme',d?'dark':'light')}catch{}};
const full=document.getElementById('fullscreen');full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error()}catch{message('全画面にできない場合は、ブラウザーで F11 を押してな。','')}};document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'⛶ 全画面を終了':'⛶ 全画面表示';full.setAttribute('aria-pressed',String(!!document.fullscreenElement))});next();
</script></body></html>
